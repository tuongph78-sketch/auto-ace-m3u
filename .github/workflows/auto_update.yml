name: Auto Update M3U Playlist

on:
  # Tự động chạy theo lịch trình (Ví dụ: Cứ mỗi 6 tiếng chạy 1 lần)
  schedule:
    - cron: '0 */6 * * *'
  
  # Cho phép bấm nút chạy thủ công trên web (Workflow Dispatch)
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Tải mã nguồn của repository xuống máy chủ ảo GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt các thư viện cần thiết (requests)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Sửa lại đường dẫn thư mục trong file main.py để chạy trên môi trường Linux của GitHub
      - name: Adjust script path for Linux
        run: |
          # Tự động chuyển thư mục lưu file về thư mục hiện tại của repository trên GitHub Actions
          sed -i 's|Path(r"C:\\Users\\Admin\\Desktop\\PDF")|Path(".")|g' main.py

      # 5. Chạy file script Python
      - name: Run Python script
        run: python main.py

      # 6. Tự động commit và đẩy file .m3u mới lên GitHub nếu có thay đổi
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add *.m3u
          git diff --staged --quiet || (git commit -m "Auto-update M3U playlist via GitHub Actions" && git push)
